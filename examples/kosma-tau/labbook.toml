# Real-world configuration: the KOSMA-tau PDR code (Fortran, run scripts, reference observations).
# Translated to the English key names; the project itself still uses the German names of the
# first version (`[schutz] geschuetzt`, ...), which the tool accepts unchanged. Its notebook
# directory `laborbuch/` is a nested clone of a separate, private notebook repository.

[paths]
notebook = "laborbuch"
archive = ".laborbuch-archiv"

[book]
title = 'Laborbuch KOSMA-$\tau$'
author = "Markus Röllig"

[protection]
protected = [
  # notebook infrastructure (legacy German layout: _vorlagen, konventionen.qmd)
  "laborbuch/konventionen.qmd",
  "laborbuch/results.tsv",
  "laborbuch/_state/events.jsonl",
  "laborbuch/_trace/**",
  "laborbuch/runs/**",
  "laborbuch/_vorlagen/**",
  "laborbuch/_extensions/**",
  "laborbuch/_quarto.yml",
  ".claude/hooks/**",
  ".claude/settings.json",
  ".claude/laborbuch.toml",
  ".claude/laborbuch.sha256",
  ".claude/agents/protokoll-auditor.md",
  ".claude/skills/laborbuch/**",
  "tools/lb.py",
  # reference and observational data (target values of fits and tests)
  "integration_tests/baselines/**",
  "integration_tests/testdata/**",
  "integration_tests/BASELINE_REFERENCE.txt",
  "H2_paper_fit/Joblin et al. 2018/**",
  "H2_paper_fit/IC63/**",
  "H2_paper_fit/Roueff/**",
  "H2_paper_fit/grid_simline_results_v3.h5",
  "H2_paper_fit/grid_simline_results_v2.h5",
]
append_only = [
  "laborbuch/results.tsv",
  "laborbuch/_state/events.jsonl",
  "laborbuch/_trace/**",
  "laborbuch/runs/**",
]

[relevance]
code = [
  "pdrsrc/src/main/**/*.f90", "pdrsrc/src/main/**/*.F90", "pdrsrc/src/main/**/*.f", "pdrsrc/src/main/**/*.c",
  "pdrinpdata/**",                      # molecular, line, dust and rate data
  "rundir/chem_rates*.dat",             # chemical network
  "simline/molecules/**",               # LAMDA files for the radiative transfer
  "h2py/kosma_h2/data/**",
]
comment_prefixes = ["!"]
deviation = [
  "rundir/pdr_config.json*",
  "rundir_test/pdr_config.json*",
  "rundir_test/run_*.sh",
  "integration_tests/cases/**",
  "tests/**",
  "H2_paper_fit/my_config*.yaml",
  "H2_paper_fit/fit_*.py",
]
test_commands = ['^make test', '\bctest\b', '\bpytest\b', 'reports/scripts/check_[a-z0-9_]+\.py', 'integration_tests/.*\.sh']
test_failure_pattern = '\b\d+ failed\b|FAILED|Tests? failed|\bFAIL\b'
build_commands = ['^make\b', '\bmake (DEBUG=1 )?JSON_FORTRAN_DIR', '\bifx\b', '\bgfortran\b']
run_commands = ['lb\.py\s+run\b']

[run]
require_committed_hypothesis = true
allow_dirty = true
compiler_command = "ifx --version"
env_vars = ["OMP_NUM_THREADS", "OMP_STACKSIZE", "MKL_NUM_THREADS", "JSON_FORTRAN_DIR"]
min_free_gb = 10
id_range = "1-999"                # this machine; the second machine sets LB_ID_RANGE="1000-1999"

[check]
render = "pdf"
stop_check = "always"
max_stop_blocks = 5

[trace]
max_chars = 4000
omit_response = ["Read", "Grep", "Glob"]
archive_transcripts = true
