# Base configuration. Single documents are rendered with it (stop-hook check);
# the complete book via the profile `buch` (tools/lb.py buch generates _quarto-buch.yml).
project:
  type: default
  render:
    - "eintraege/*/entry.qmd"
    - "sessions/*/*.qmd"

lang: en
number-sections: true
crossref:
  fig-prefix: Fig.
  eq-prefix: Eq.
  tbl-prefix: Tab.

format:
  html:
    default-image-extension: png
    html-math-method: mathjax
    toc: true
    embed-resources: true
  pdf:
    default-image-extension: pdf
    pdf-engine: xelatex
    documentclass: scrartcl
    papersize: a4
    toc: false
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{siunitx}
        \usepackage{booktabs}
        % layout fixes 2026-09-17: smaller table font, breakable identifiers, more stretch
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\footnotesize}
        \setlength{\emergencystretch}{3em}
        \usepackage[htt]{hyphenat}
        \let\lbOrigUnderscore\_
        \renewcommand{\_}{\lbOrigUnderscore\allowbreak}
        % (the seqsplit wrapper of \texttt was removed on 2026-09-17: it fails in captions,
        %  "Undefined control sequence \SQSPL@scan"; hyphenat[htt] + breakable \_ suffice)
