# Base configuration. Single documents are rendered with it (stop-hook check);
# the complete book via the profile `book` (tools/lb.py book generates _quarto-book.yml).
project:
  type: default
  render:
    - "entries/*/entry.qmd"
    - "sessions/*/*.qmd"

lang: en
number-sections: true
crossref:
  fig-prefix: Fig.
  eq-prefix: Eq.
  tbl-prefix: Tab.

format:
  html:
    default-image-extension: png
    html-math-method: mathjax
    toc: true
    embed-resources: true
  pdf:
    default-image-extension: pdf
    pdf-engine: xelatex
    documentclass: scrartcl
    papersize: a4
    toc: false
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{siunitx}
        \usepackage{booktabs}
        % smaller table font, breakable identifiers and underscores, more stretch
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\footnotesize}
        \setlength{\emergencystretch}{3em}
        \usepackage[htt]{hyphenat}
        \let\lbOrigUnderscore\_
        \renewcommand{\_}{\lbOrigUnderscore\allowbreak}
